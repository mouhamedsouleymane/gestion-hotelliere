name: Laravel

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
    # 1. Checkout du code
    - uses: actions/checkout@v3

    # 2. Setup PHP
    - uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, bcmath, pdo_mysql
        coverage: none

    # 3. Cache Composer
    - name: Cache Composer
      uses: actions/cache@v3
      with:
        path: vendor
        key: composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: composer-

    # 4. Installer dépendances PHP
    - name: Install dependencies (Composer)
      run: composer install --no-progress --prefer-dist --optimize-autoloader

    # 5. Setup Node.js
    - uses: actions/setup-node@v3
      with:
        node-version: '18'

    # 6. Cache npm
    - name: Cache npm
      uses: actions/cache@v3
      with:
        path: ~/.npm
        key: npm-${{ hashFiles('**/package-lock.json') }}
        restore-keys: npm-

    # 7. Installer dépendances JS
    - name: Install dependencies (npm)
      run: npm ci

    # 8. Build Vite (important pour générer manifest.json)
    - name: Build assets
      run: npm run build

    # 9. Configurer l’environnement Laravel
    - name: Copy .env
      run: cp .env.example .env

    - name: Generate key
      run: php artisan key:generate

    - name: Run migrations
      run: php artisan migrate --force

    # 10. Lancer les tests
    - name: Run tests
      run: php artisan test
