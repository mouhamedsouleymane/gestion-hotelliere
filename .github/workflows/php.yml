name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    services: {}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, intl, xml, bcmath, sqlite, pdo_sqlite

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: |
            ~/.composer/cache
            vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --optimize-autoloader

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-

      - name: Install Node dependencies and build
        run: |
          npm ci
          npm run build --if-present

      - name: Prepare environment
        run: |
          cp .env.example .env || true
          php artisan key:generate || true

      - name: Ensure SQLite directory
        run: |
          mkdir -p database || true
          touch database/database.sqlite || true

      - name: Run migrations
        run: DB_CONNECTION=sqlite DB_DATABASE=database/database.sqlite php artisan migrate --force --no-interaction

      - name: Run tests
        run: |
          ./vendor/bin/phpunit --colors=never || php artisan test --no-interaction
